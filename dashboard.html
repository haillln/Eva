<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — EVA</title>
</head>
<body>

  <template id="eva-page-content">
    <!-- EVA Trading Journal Dashboard — REBUILT FROM SCRATCH.
         Real Firestore data only (users/{uid}/accounts/{id}/trades/{id}).
         Old dashboard.html/js were used as visual reference ONLY — none
         of the old JS architecture was reused. See chat for full report. -->

    <style>
      /* =========================================================
         SCOPE: namespaced "db-", built entirely on the shared
         layout's CSS variables (--eva-bg, --eva-surface, --eva-text,
         --eva-gradient, etc.) so dark/light mode keep working with
         zero extra wiring.
         ========================================================= */
      .db-wrap{
        --db-radius-lg:20px;
        --db-radius-md:14px;
        --db-radius-sm:10px;
        --db-gap:16px;

        --db-pos:#22C55E;
        --db-pos-bg:rgba(34,197,94,0.12);
        --db-pos-border:rgba(34,197,94,0.35);

        --db-neg:#EF4444;
        --db-neg-bg:rgba(239,68,68,0.12);
        --db-neg-border:rgba(239,68,68,0.35);

        --db-warn:#F59E0B;
        --db-warn-bg:rgba(245,158,11,0.12);
        --db-warn-border:rgba(245,158,11,0.35);

        max-width:1400px;
        margin:0 auto;
        padding-bottom:48px;
        font-family:var(--eva-font-body);
        color:var(--eva-text);
      }
      .db-wrap *{ box-sizing:border-box; min-width:0; }
      .db-wrap h1,.db-wrap h2,.db-wrap h3,.db-wrap p,.db-wrap span,.db-wrap label{ color:inherit; }
      .db-wrap button{ font-family:inherit; cursor:pointer; }
      .db-wrap select,.db-wrap input{ font-family:inherit; }

      .db-section{ margin-bottom:20px; }
      .db-section-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
      .db-section-title{ font-family:var(--eva-font-display); font-size:1rem; font-weight:700; letter-spacing:-0.1px; display:flex; align-items:center; gap:8px; }
      .db-section-title svg{ width:17px; height:17px; stroke:var(--eva-text-dim); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .db-section-sub{ font-size:0.78rem; color:var(--eva-text-dim); margin-top:2px; }

      .db-card{ background:var(--eva-surface); border:1px solid var(--eva-border); border-radius:var(--db-radius-lg); padding:18px; }
      .db-num{ font-family:var(--eva-font-display); font-weight:700; letter-spacing:-0.4px; font-variant-numeric:tabular-nums; }
      .db-label{ font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--eva-text-dim); }
      .db-pos{ color:var(--db-pos); }
      .db-neg{ color:var(--db-neg); }
      .db-neu{ color:var(--eva-text-dim); }

      .db-grid{ display:grid; gap:var(--db-gap); }
      .db-grid-4{ grid-template-columns:repeat(4,1fr); }
      .db-grid-3{ grid-template-columns:repeat(3,1fr); }
      @media (max-width:1100px){ .db-grid-4{ grid-template-columns:repeat(2,1fr);} .db-grid-3{ grid-template-columns:repeat(2,1fr);} }
      @media (max-width:560px){ .db-grid-4,.db-grid-3{ grid-template-columns:repeat(2,1fr); gap:10px; } }

      .db-btn{
        display:inline-flex; align-items:center; gap:8px; padding:9px 14px;
        border-radius:var(--db-radius-sm); border:1px solid var(--eva-border);
        background:var(--eva-surface-2); color:var(--eva-text); font-size:0.84rem; font-weight:600;
        transition:background-color .2s var(--eva-ease);
      }
      .db-btn:hover{ background:var(--eva-border); }
      .db-btn svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .db-btn-primary{ background:var(--eva-gradient); border:none; color:#fff; }
      .db-btn-primary:hover{ filter:brightness(1.08); }
      .db-btn-icon{ padding:9px; }
      .db-btn:disabled{ opacity:.5; cursor:not-allowed; }

      /* ---------- header ---------- */
      .db-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
      .db-header h1{ font-family:var(--eva-font-display); font-size:1.5rem; font-weight:700; }
      .db-header p{ font-size:0.86rem; color:var(--eva-text-dim); margin-top:2px; }
      .db-header-actions{ display:flex; align-items:center; gap:8px; }

      /* ---------- account dropdown ---------- */
      .db-account-dropdown{ position:relative; }
      .db-account-trigger{
        display:flex; align-items:center; gap:10px; padding:8px 12px;
        border-radius:var(--db-radius-sm); border:1px solid var(--eva-border); background:var(--eva-surface-2);
        min-width:180px; max-width:260px;
      }
      .db-account-trigger-icon{ width:30px; height:30px; border-radius:9px; background:var(--eva-gradient); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .db-account-trigger-icon svg{ width:16px; height:16px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .db-account-trigger-info{ display:flex; flex-direction:column; align-items:flex-start; min-width:0; flex:1; }
      .db-account-trigger-name{ font-size:0.84rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
      .db-account-trigger-meta{ font-size:0.72rem; color:var(--eva-text-dim); white-space:nowrap; }
      .db-account-trigger-chevron{ width:15px; height:15px; stroke:var(--eva-text-dim); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; transition:transform .2s var(--eva-ease); }
      .db-account-trigger.db-open .db-account-trigger-chevron{ transform:rotate(180deg); }

      .db-account-panel{
        position:fixed; visibility:hidden; opacity:0; pointer-events:none;
        width:300px; max-width:92vw;
        background:var(--eva-surface); border:1px solid var(--eva-border); border-radius:var(--db-radius-md);
        box-shadow:var(--eva-shadow); z-index:960; overflow:hidden;
        display:flex; flex-direction:column;
        transition:opacity .16s var(--eva-ease);
      }
      .db-account-panel.db-open{ visibility:visible; opacity:1; pointer-events:auto; }
      .db-account-panel-header{ padding:12px 14px 8px; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--eva-text-dim); }
      .db-account-list{ overflow-y:auto; max-height:280px; padding:0 6px 6px; }
      .db-account-item{
        display:flex; align-items:center; gap:10px; width:100%; padding:9px 8px; border-radius:10px;
        background:none; border:none; text-align:left; color:var(--eva-text);
      }
      .db-account-item:hover{ background:var(--eva-surface-2); }
      .db-account-item.db-active{ background:var(--eva-surface-2); }
      .db-account-item-dot{ width:8px; height:8px; border-radius:50%; background:var(--db-pos); flex-shrink:0; }
      .db-account-item-dot.db-dot-demo{ background:var(--db-warn); }
      .db-account-item-info{ display:flex; flex-direction:column; min-width:0; flex:1; }
      .db-account-item-name{ font-size:0.85rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .db-account-item-meta{ font-size:0.72rem; color:var(--eva-text-dim); display:flex; gap:6px; }
      .db-account-item-balance{ font-size:0.82rem; font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0; }
      .db-account-item-check{ width:15px; height:15px; stroke:var(--eva-accent-1); fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
      .db-account-panel-footer{ padding:10px; border-top:1px solid var(--eva-border); }
      .db-account-empty{ padding:22px 14px; text-align:center; color:var(--eva-text-dim); font-size:0.82rem; }
      .db-account-backdrop{ position:fixed; inset:0; z-index:955; display:none; }
      .db-account-backdrop.db-open{ display:block; }

      /* ---------- empty state (no accounts at all) ---------- */
      .db-empty-page{
        display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
        padding:64px 20px; gap:14px; background:var(--eva-surface); border:1px solid var(--eva-border); border-radius:var(--db-radius-lg);
      }
      .db-empty-page svg{ width:44px; height:44px; stroke:var(--eva-text-dim); fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
      .db-empty-page h2{ font-family:var(--eva-font-display); font-size:1.15rem; font-weight:700; }
      .db-empty-page p{ font-size:0.86rem; color:var(--eva-text-dim); max-width:320px; }

      /* ---------- hero summary ---------- */
      .db-hero-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--db-gap); }
      @media (max-width:900px){ .db-hero-grid{ grid-template-columns:repeat(2,1fr); } }
      .db-hero-card .db-label{ margin-bottom:6px; }
      .db-hero-value{ font-size:1.6rem; }
      @media (max-width:560px){ .db-hero-value{ font-size:1.3rem; } }
      .db-hero-sub{ font-size:0.76rem; color:var(--eva-text-dim); margin-top:4px; }

      /* ---------- date filter pills ---------- */
      .db-filter-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .db-pill-switch{ display:inline-flex; padding:3px; border-radius:999px; background:var(--eva-surface-2); border:1px solid var(--eva-border); gap:2px; flex-wrap:wrap; }
      .db-pill-switch button{ padding:6px 13px; border-radius:999px; border:none; background:none; color:var(--eva-text-dim); font-size:0.78rem; font-weight:600; }
      .db-pill-switch button.db-active{ background:var(--eva-gradient); color:#fff; }

      /* ---------- stat grid ---------- */
      .db-stat-card{ display:flex; flex-direction:column; gap:6px; }
      .db-stat-value{ font-size:1.25rem; }
      @media (max-width:560px){ .db-stat-value{ font-size:1.05rem; } }

      /* ---------- charts ---------- */
      .db-chart-card{ padding-bottom:8px; }
      .db-chart-canvas{ width:100%; height:280px; position:relative; }
      .db-chart-canvas.db-chart-md{ height:220px; }
      .db-chart-empty{
        position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
        gap:8px; color:var(--eva-text-dim); font-size:0.82rem; text-align:center; padding:0 20px;
      }
      .db-chart-empty svg{ width:30px; height:30px; stroke:var(--eva-text-dim); fill:none; stroke-width:1.6; }
      .db-charts-grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--db-gap); }
      @media (max-width:900px){ .db-charts-grid{ grid-template-columns:1fr; } }

      /* ---------- calendar ---------- */
      .db-cal-card{ overflow:visible; }
      .db-cal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
      .db-cal-nav{ display:flex; align-items:center; gap:10px; }
      .db-cal-nav button{ width:30px; height:30px; border-radius:9px; border:1px solid var(--eva-border); background:var(--eva-surface-2); display:flex; align-items:center; justify-content:center; }
      .db-cal-nav button svg{ width:16px; height:16px; stroke:var(--eva-text); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
      .db-cal-title{ font-family:var(--eva-font-display); font-weight:700; font-size:0.98rem; min-width:130px; text-align:center; }
      .db-cal-today-btn{ padding:6px 12px; border-radius:999px; border:1px solid var(--eva-border); background:var(--eva-surface-2); font-size:0.78rem; font-weight:600; color:var(--eva-text); }

      .db-cal-weekdays{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-bottom:6px; }
      .db-cal-weekdays span{ text-align:center; font-size:0.68rem; font-weight:700; color:var(--eva-text-dim); text-transform:uppercase; letter-spacing:.04em; }
      .db-cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; max-width:100%; }
      .db-cal-day{
        aspect-ratio:1/0.82; border-radius:10px; border:1px solid var(--eva-border); background:var(--eva-surface-2);
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
        font-size:0.78rem; font-weight:700; color:var(--eva-text); position:relative; min-height:52px;
      }
      .db-cal-day.db-cal-blank{ background:transparent; border-color:transparent; }
      .db-cal-day.db-has-trades{ cursor:pointer; }
      .db-cal-day.db-has-trades:hover{ filter:brightness(1.08); }
      .db-cal-day.db-day-pos{ background:var(--db-pos-bg); border-color:var(--db-pos-border); color:var(--db-pos); }
      .db-cal-day.db-day-neg{ background:var(--db-neg-bg); border-color:var(--db-neg-border); color:var(--db-neg); }
      .db-cal-day.db-day-be{ background:var(--db-warn-bg); border-color:var(--db-warn-border); color:var(--db-warn); }
      .db-cal-day.db-is-today{ outline:2px solid var(--eva-accent-1); outline-offset:1px; }
      .db-cal-day-num{ font-size:0.72rem; font-weight:600; opacity:.85; }
      .db-cal-day-pl{ font-size:0.76rem; font-weight:700; }
      .db-cal-day-count{ font-size:0.62rem; font-weight:600; opacity:.75; }
      @media (max-width:560px){ .db-cal-day{ font-size:0.66rem; min-height:44px; } .db-cal-day-pl{ font-size:0.66rem; } }

      .db-cal-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:0.74rem; color:var(--eva-text-dim); }
      .db-cal-legend span{ display:inline-flex; align-items:center; gap:6px; }
      .db-cal-legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

      .db-cal-week-list{ display:flex; flex-direction:column; gap:8px; }
      .db-cal-week-row{
        display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px;
        border-radius:12px; border:1px solid var(--eva-border); background:var(--eva-surface-2); cursor:pointer;
      }
      .db-cal-week-row:hover{ filter:brightness(1.06); }
      .db-cal-week-date{ font-size:0.85rem; font-weight:700; }
      .db-cal-week-meta{ font-size:0.74rem; color:var(--eva-text-dim); }

      .db-cal-year-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
      @media (max-width:700px){ .db-cal-year-grid{ grid-template-columns:repeat(2,1fr); } }
      .db-cal-year-tile{
        padding:14px; border-radius:14px; border:1px solid var(--eva-border); background:var(--eva-surface-2);
        display:flex; flex-direction:column; gap:6px; cursor:pointer;
      }
      .db-cal-year-tile:hover{ filter:brightness(1.06); }
      .db-cal-year-tile-name{ font-weight:700; font-size:0.88rem; }
      .db-cal-year-tile-pl{ font-size:1rem; font-weight:700; }
      .db-cal-year-tile-meta{ font-size:0.72rem; color:var(--eva-text-dim); }

      /* ---------- modals ---------- */
      .db-modal-overlay{
        position:fixed; inset:0; background:rgba(6,8,12,0.55); backdrop-filter:blur(2px);
        display:flex; align-items:center; justify-content:center; padding:16px; z-index:1000;
        opacity:0; pointer-events:none; transition:opacity .2s var(--eva-ease);
      }
      .db-modal-overlay.db-open{ opacity:1; pointer-events:auto; }
      .db-modal{
        width:100%; max-width:520px; max-height:min(680px,86vh); background:var(--eva-surface);
        border:1px solid var(--eva-border); border-radius:var(--db-radius-lg); box-shadow:var(--eva-shadow);
        display:flex; flex-direction:column; overflow:hidden;
      }
      .db-modal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px; border-bottom:1px solid var(--eva-border); flex-shrink:0; }
      .db-modal-title{ font-family:var(--eva-font-display); font-size:1.02rem; font-weight:700; }
      .db-modal-close{ width:30px; height:30px; border-radius:9px; border:1px solid var(--eva-border); background:var(--eva-surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
      .db-modal-close svg{ width:15px; height:15px; stroke:var(--eva-text); fill:none; stroke-width:2; stroke-linecap:round; }
      .db-modal-body{ padding:16px 18px; overflow-y:auto; flex:1; }
      .db-modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:14px 18px; border-top:1px solid var(--eva-border); flex-shrink:0; }

      .db-day-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
      .db-day-summary .db-card{ padding:12px; }
      .db-day-trades-list{ display:flex; flex-direction:column; gap:10px; }
      .db-trade-row{ border:1px solid var(--eva-border); border-radius:12px; padding:12px; background:var(--eva-surface-2); }
      .db-trade-row-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
      .db-trade-row-symbol{ font-weight:700; font-size:0.92rem; display:flex; align-items:center; gap:8px; }
      .db-pill{ font-size:0.68rem; font-weight:700; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em; }
      .db-pill-long{ color:var(--db-pos); background:var(--db-pos-bg); }
      .db-pill-short{ color:var(--db-neg); background:var(--db-neg-bg); }
      .db-trade-row-pl{ font-weight:700; font-size:0.92rem; }
      .db-trade-row-meta{ font-size:0.76rem; color:var(--eva-text-dim); display:flex; flex-wrap:wrap; gap:6px 10px; }
      .db-day-empty{ text-align:center; padding:30px 10px; color:var(--eva-text-dim); font-size:0.85rem; }

      .db-field{ margin-bottom:14px; }
      .db-field label{ display:block; font-size:0.76rem; font-weight:700; color:var(--eva-text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
      .db-field input{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--eva-border); background:var(--eva-surface-2); color:var(--eva-text); font-size:0.9rem; }
      .db-field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

      /* ---------- loading / toast ---------- */
      .db-loading-row{ display:flex; align-items:center; gap:8px; color:var(--eva-text-dim); font-size:0.84rem; padding:20px; justify-content:center; }
      .db-spin{ width:16px; height:16px; border-radius:50%; border:2px solid var(--eva-border); border-top-color:var(--eva-accent-1); animation:db-spin .7s linear infinite; }
      @keyframes db-spin{ to{ transform:rotate(360deg); } }
      #dbToastHost{ position:fixed; bottom:calc(var(--nav-height,82px) + 14px); left:50%; transform:translateX(-50%); z-index:1100; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
      @media (min-width:900px){ #dbToastHost{ bottom:24px; } }

      [hidden]{ display:none !important; }
    </style>

    <div class="db-wrap" id="db-root" data-account-id="">

      <!-- ===================== HEADER ===================== -->
      <div class="db-header">
        <div>
          <h1 id="db-welcome">Dashboard</h1>
          <p>Your journal accounts, performance, and trading calendar.</p>
        </div>
        <div class="db-header-actions">
          <div class="db-account-dropdown" id="db-account-dropdown">
            <button class="db-account-trigger" id="db-account-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="db-account-trigger-icon">
                <svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 14h.01"/></svg>
              </span>
              <span class="db-account-trigger-info">
                <span class="db-account-trigger-name" id="db-account-trigger-name">Loading…</span>
                <span class="db-account-trigger-meta" id="db-account-trigger-meta">&nbsp;</span>
              </span>
              <svg class="db-account-trigger-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
          <button class="db-btn db-btn-icon" id="db-refresh-btn" type="button" aria-label="Refresh dashboard">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
        </div>
      </div>

      <!-- floating account panel (positioned by JS, clamped to viewport) -->
      <div class="db-account-backdrop" id="db-account-backdrop"></div>
      <div class="db-account-panel" id="db-account-panel" role="listbox" aria-label="Journal trading accounts">
        <div class="db-account-panel-header">Journal Accounts</div>
        <div class="db-account-list" id="db-account-list"></div>
        <div class="db-account-panel-footer">
          <a class="db-btn db-btn-primary" href="accounts.html" style="width:100%; justify-content:center;">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Create Account
          </a>
        </div>
      </div>

      <!-- ===================== NO-ACCOUNT EMPTY STATE ===================== -->
      <div class="db-empty-page" id="db-no-accounts-state" hidden>
        <svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 14h.01"/></svg>
        <h2>No trading accounts yet</h2>
        <p>Create a journal account to start tracking balance, equity, and performance here.</p>
        <a class="db-btn db-btn-primary" href="accounts.html">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create Account
        </a>
      </div>

      <!-- ===================== MAIN CONTENT (hidden until an account is selected) ===================== -->
      <div id="db-content" hidden>

        <!-- Loading row shown while trades are first loading -->
        <div class="db-loading-row" id="db-loading-row" hidden><span class="db-spin"></span> Loading trades…</div>

        <!-- HERO SUMMARY -->
        <div class="db-section">
          <div class="db-hero-grid">
            <div class="db-card db-hero-card"><span class="db-label">Current Balance</span><div class="db-num db-hero-value" id="stat-balance">—</div><div class="db-hero-sub" id="stat-balance-sub">&nbsp;</div></div>
            <div class="db-card db-hero-card"><span class="db-label">Equity</span><div class="db-num db-hero-value" id="stat-equity">—</div><div class="db-hero-sub" id="stat-equity-sub">&nbsp;</div></div>
            <div class="db-card db-hero-card"><span class="db-label">Total P/L</span><div class="db-num db-hero-value" id="stat-total-pl">—</div><div class="db-hero-sub" id="stat-total-pl-sub">&nbsp;</div></div>
            <div class="db-card db-hero-card"><span class="db-label">Today's P/L</span><div class="db-num db-hero-value" id="stat-today-pl">—</div><div class="db-hero-sub" id="stat-today-pl-sub">&nbsp;</div></div>
          </div>
        </div>

        <!-- DATE FILTER -->
        <div class="db-section">
          <div class="db-filter-row">
            <div class="db-pill-switch" id="db-date-filter">
              <button data-range="today">Today</button>
              <button data-range="week">This Week</button>
              <button class="db-active" data-range="month">This Month</button>
              <button data-range="year">This Year</button>
              <button data-range="all">All Time</button>
              <button data-range="custom">Custom</button>
            </div>
            <span class="db-section-sub" id="db-filter-summary"></span>
          </div>
        </div>

        <!-- KEY PERFORMANCE STATS -->
        <div class="db-section" id="key-performance">
          <div class="db-section-head">
            <div class="db-section-title">
              <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18.7 8 13 13.7l-4-4L3 16"/></svg>
              Performance Statistics
            </div>
          </div>
          <div class="db-grid db-grid-4">
            <div class="db-card db-stat-card"><span class="db-label">Total Trades</span><div class="db-num db-stat-value" id="stat-total-trades">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Win Rate</span><div class="db-num db-stat-value" id="stat-win-rate">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Average Win</span><div class="db-num db-stat-value" id="stat-avg-win">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Average Loss</span><div class="db-num db-stat-value" id="stat-avg-loss">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Profit Factor</span><div class="db-num db-stat-value" id="stat-profit-factor">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Average R</span><div class="db-num db-stat-value" id="stat-avg-r">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Largest Win</span><div class="db-num db-stat-value" id="stat-largest-win">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Largest Loss</span><div class="db-num db-stat-value" id="stat-largest-loss">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Max Drawdown</span><div class="db-num db-stat-value" id="stat-drawdown">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Recovery Factor</span><div class="db-num db-stat-value" id="stat-recovery">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Best Day</span><div class="db-num db-stat-value" id="stat-best-day">—</div></div>
            <div class="db-card db-stat-card"><span class="db-label">Worst Day</span><div class="db-num db-stat-value" id="stat-worst-day">—</div></div>
          </div>
        </div>

        <!-- EQUITY CURVE -->
        <div class="db-section">
          <div class="db-card db-chart-card">
            <div class="db-section-head" style="margin-bottom:8px;">
              <div class="db-section-title">
                <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
                Equity Curve
              </div>
              <span class="db-section-sub" id="db-equity-sub"></span>
            </div>
            <div class="db-chart-canvas" id="equity-chart">
              <div class="db-chart-empty" id="equity-chart-empty">
                <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/></svg>
                <span>Your equity curve will appear here once trades are logged.</span>
              </div>
            </div>
          </div>
        </div>

        <!-- DAILY P/L + DRAWDOWN -->
        <div class="db-section">
          <div class="db-charts-grid">
            <div class="db-card db-chart-card">
              <div class="db-section-head" style="margin-bottom:8px;"><div class="db-section-title">Daily P/L</div></div>
              <div class="db-chart-canvas db-chart-md" id="daily-pl-chart">
                <div class="db-chart-empty"><span>No trades in this range yet.</span></div>
              </div>
            </div>
            <div class="db-card db-chart-card">
              <div class="db-section-head" style="margin-bottom:8px;"><div class="db-section-title">Drawdown</div></div>
              <div class="db-chart-canvas db-chart-md" id="drawdown-chart">
                <div class="db-chart-empty"><span>No trades in this range yet.</span></div>
              </div>
            </div>
          </div>
        </div>

        <!-- TRADING CALENDAR -->
        <div class="db-section" id="trading-calendar">
          <div class="db-card db-cal-card">
            <div class="db-cal-head">
              <div class="db-section-title">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Trading Calendar
              </div>
              <div class="db-pill-switch" id="db-cal-view-switch">
                <button class="db-active" data-view="month">Month</button>
                <button data-view="week">Week</button>
                <button data-view="year">Year</button>
              </div>
            </div>
            <div class="db-cal-head">
              <button class="db-cal-today-btn" id="db-cal-today-btn" type="button">Today</button>
              <div class="db-cal-nav">
                <button id="db-cal-prev-btn" type="button" aria-label="Previous"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
                <span class="db-cal-title" id="db-cal-title">—</span>
                <button id="db-cal-next-btn" type="button" aria-label="Next"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
              </div>
              <span style="width:1px;"></span>
            </div>

            <div id="db-cal-month-view">
              <div class="db-cal-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
              <div class="db-cal-grid" id="db-cal-grid"></div>
              <div class="db-cal-legend">
                <span><i style="background:var(--db-pos);"></i> Profitable day</span>
                <span><i style="background:var(--db-neg);"></i> Loss day</span>
                <span><i style="background:var(--db-warn);"></i> Break-even day</span>
              </div>
            </div>

            <div id="db-cal-week-view" hidden>
              <div class="db-cal-week-list" id="db-cal-week-list"></div>
            </div>

            <div id="db-cal-year-view" hidden>
              <div class="db-cal-year-grid" id="db-cal-year-grid"></div>
            </div>
          </div>
        </div>

      </div><!-- /db-content -->

      <!-- ===================== DAY MODAL ===================== -->
      <div class="db-modal-overlay" id="db-day-modal" aria-hidden="true">
        <div class="db-modal" role="dialog" aria-modal="true" aria-labelledby="db-day-modal-title">
          <div class="db-modal-head">
            <div>
              <div class="db-modal-title" id="db-day-modal-title">—</div>
            </div>
            <button class="db-modal-close" type="button" data-close-modal="db-day-modal" aria-label="Close">
              <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
          </div>
          <div class="db-modal-body">
            <div class="db-day-summary">
              <div class="db-card"><span class="db-label">Day P/L</span><div class="db-num" id="db-day-pl">—</div></div>
              <div class="db-card"><span class="db-label">Trades</span><div class="db-num" id="db-day-count">—</div></div>
              <div class="db-card"><span class="db-label">Win Rate</span><div class="db-num" id="db-day-winrate">—</div></div>
            </div>
            <div class="db-day-trades-list" id="db-day-trades-list"></div>
          </div>
        </div>
      </div>

      <!-- ===================== CUSTOM RANGE MODAL ===================== -->
      <div class="db-modal-overlay" id="db-custom-range-modal" aria-hidden="true">
        <div class="db-modal" style="max-width:400px;" role="dialog" aria-modal="true" aria-labelledby="db-custom-range-title">
          <div class="db-modal-head">
            <div class="db-modal-title" id="db-custom-range-title">Custom Date Range</div>
            <button class="db-modal-close" type="button" data-close-modal="db-custom-range-modal" aria-label="Close">
              <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
          </div>
          <div class="db-modal-body">
            <div class="db-field-row">
              <div class="db-field"><label for="db-custom-start">Start Date</label><input type="date" id="db-custom-start"></div>
              <div class="db-field"><label for="db-custom-end">End Date</label><input type="date" id="db-custom-end"></div>
            </div>
          </div>
          <div class="db-modal-foot">
            <button class="db-btn" type="button" data-close-modal="db-custom-range-modal">Cancel</button>
            <button class="db-btn db-btn-primary" id="db-custom-range-apply" type="button">Apply</button>
          </div>
        </div>
      </div>

    </div><!-- /db-wrap -->

    <!-- Dashboard runtime dependencies. These scripts live inside the template so
         eva-loader can safely recreate them after the page content is mounted. -->
    <script type="module" src="dashboard.js"></script>
  </template>

  <script src="eva-loader.js"></script>
</body>
</html>
